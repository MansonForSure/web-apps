<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Lesson 12 demo — Shaders: painting with the GPU</title>
  <link rel="stylesheet" href="../kit/demo.css" />
  <script type="importmap">
    { "imports": { "three": "../../assets/vendor/three/three.module.js", "three/addons/": "../../assets/vendor/three/addons/" } }
  </script>
  <style>
    /* Shader-specific UI; the shared stylesheet supplies the paper/ink controls. */
    .panel { width: 266px; max-width: calc(100vw - 44px); }
    .panel .row { flex-wrap: nowrap; }
    .panel .row button { flex: 1; padding: 7px 5px; font-size: 12px; }
    .description { margin: 0; color: #55515c; font-size: 12px; }
    .uniform-row { display: grid !important; grid-template-columns: 74px 1fr 32px; gap: 6px !important; }
    .uniform-row output { text-align: right; font: 11px ui-monospace, monospace; }
    .colours { display: flex; gap: 14px; }
    .colours label { flex: 1; justify-content: space-between; }
    input[type="color"] { width: 40px; height: 28px; padding: 1px; border: 1px solid #aaa49a; border-radius: 5px; background: #fff; cursor: pointer; }
    .code-panel { position: fixed; right: 10px; bottom: 56px; z-index: 6; width: 330px; border-radius: 10px; overflow: hidden; background: #1b1a22; color: #f4f1ea; box-shadow: 0 6px 20px #0003; }
    .code-panel summary { padding: 10px 12px; cursor: pointer; font-weight: 700; color: #2fd9ff; }
    .code-panel pre { max-height: 250px; overflow: auto; margin: 0; padding: 0 12px 12px; font: 12px/1.5 ui-monospace, monospace; tab-size: 2; white-space: pre-wrap; overflow-wrap: anywhere; }
    canvas { touch-action: none; }
    @media (max-width: 600px) {
      .panel { width: auto; left: 10px; right: 10px; max-width: none; gap: 5px; }
      .code-panel { left: 10px; right: 10px; bottom: 62px; width: auto; }
      .code-panel pre { max-height: 190px; }
      .hint { bottom: 12px; max-width: calc(100vw - 40px); white-space: normal; text-align: center; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Lesson 12 · Shader playground</h2>
    <div class="row" aria-label="Choose a shader">
      <button data-shader="sky" class="on" aria-pressed="true">Gradient sky</button>
      <button data-shader="swirl" aria-pressed="false">Portal swirl</button>
      <button data-shader="wobble" aria-pressed="false">Wobble</button>
    </div>
    <p class="description" id="description">Inside a sphere: height paints the sky.</p>
    <div id="sliders"></div>
    <div class="colours" id="colours"></div>
    <label><input type="checkbox" id="debug" /> Debug values as colours</label>
    <div class="row"><button id="pause" aria-pressed="false">Pause time</button><button id="reset">Reset view</button></div>
    <div class="stat">GPU time <b id="time">0.00</b> · <b id="stage-name">fragment</b></div>
  </div>
  <details class="code-panel" id="code-panel" open>
    <summary>Show active GLSL</summary>
    <pre id="source" tabindex="0" aria-label="Active shader source"></pre>
  </details>
  <div class="hint">
    <span class="keys">Drag to orbit · scroll to zoom · 1 / 2 / 3 switch shaders</span>
    <span class="touch">Drag to orbit · pinch to zoom · tap a shader</span>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createStage } from '../kit/stage.js';

    const { scene, camera, renderer } = createStage({ background: '#e9e5db', shadows: false, fog: null, fov: 50 });
    // No lights are needed: these shaders calculate the final surface colour.
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 3.8;
    controls.maxDistance = 14;
    controls.minPolarAngle = 0.25;
    controls.maxPolarAngle = Math.PI - 0.25;
    const phone = window.matchMedia('(max-width: 600px)');
    document.body.classList.toggle('touch', window.matchMedia('(pointer: coarse)').matches);
    document.getElementById('code-panel').open = !phone.matches;

    // A vertex shader passes world position to the sky's fragment shader.
    // #region sky-vertex
    const skyVertex = /* glsl */ `
      varying vec3 vWorldPosition;
      void main() {
        vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    // #endregion
    // #region sky-shader
    const skyFragment = /* glsl */ `
      uniform vec3 uHorizon, uZenith;
      uniform float uTime, uStrength, uDebug;
      varying vec3 vWorldPosition;
      void main() {
        vec3 direction = normalize(vWorldPosition);
        float height = clamp(direction.y, 0.0, 1.0);
        vec3 colour = mix(uHorizon, uZenith, smoothstep(0.0, 0.65, height));
        vec3 sunDirection = normalize(vec3(0.12 + sin(uTime * 0.25) * 0.08, 0.22, -0.9));
        float distanceToSun = length(direction - sunDirection);
        float glow = 1.0 - smoothstep(0.0, 0.35, distanceToSun);
        float disc = 1.0 - smoothstep(0.035, 0.055, distanceToSun);
        colour += vec3(1.0, 0.8, 0.45) * (glow * 0.4 + disc * 2.0) * uStrength;
        if (uDebug > 0.5) colour = vec3(height);
        gl_FragColor = vec4(colour, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `;
    // #endregion

    // #region uv-vertex
    const uvVertex = /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    // #endregion
    // #region swirl-shader
    const swirlFragment = /* glsl */ `
      uniform float uTime, uFrequency, uStrength, uDebug;
      uniform vec3 uInner, uOuter;
      varying vec2 vUv;
      void main() {
        vec2 p = (vUv - 0.5) * 2.0;
        float radius = length(p);
        float angle = atan(p.y, p.x + 0.00001);
        float wave = sin(angle * 3.0 + radius * uFrequency - uTime) * 0.5 + 0.5;
        float rings = fract(radius * 5.0 - uTime * 0.15);
        vec3 colour = mix(uInner, uOuter, smoothstep(0.0, 1.0, radius));
        colour *= 0.4 + wave * uStrength + (1.0 - rings) * 0.18;
        if (uDebug > 0.5) colour = vec3(vUv, 0.0);
        float alpha = 1.0 - smoothstep(0.92, 1.0, radius);
        gl_FragColor = vec4(colour, alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `;
    // #endregion

    // #region wobble-shader
    const wobbleVertex = /* glsl */ `
      uniform float uTime, uFrequency, uStrength;
      varying float vDisplacement;
      void main() {
        vec3 waves = sin(position * uFrequency + vec3(uTime));
        float wave = (waves.x + waves.y + waves.z) / 3.0;
        vDisplacement = wave * uStrength;
        vec3 displaced = position + normal * vDisplacement;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
      }
    `;
    // #endregion
    // #region wobble-colour
    const wobbleFragment = /* glsl */ `
      uniform vec3 uLow, uHigh;
      uniform float uStrength, uDebug;
      varying float vDisplacement;
      void main() {
        float amount = vDisplacement / max(uStrength, 0.001) * 0.5 + 0.5;
        vec3 colour = mix(uLow, uHigh, amount);
        if (uDebug > 0.5) colour = vec3(amount);
        gl_FragColor = vec4(colour, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `;
    // #endregion

    const skyUniforms = {
      uTime: { value: 0 }, uStrength: { value: 1.2 }, uDebug: { value: 0 },
      uHorizon: { value: new THREE.Color('#ffd7b5') },
      uZenith: { value: new THREE.Color('#3f8fdc') },
    };
    const swirlUniforms = {
      uTime: { value: 0 }, uFrequency: { value: 9 }, uStrength: { value: 1.2 }, uDebug: { value: 0 },
      uInner: { value: new THREE.Color('#fff3d1') },
      uOuter: { value: new THREE.Color('#ff5b2e') },
    };
    const wobbleUniforms = {
      uTime: { value: 0 }, uFrequency: { value: 3 }, uStrength: { value: 0.28 }, uDebug: { value: 0 },
      uLow: { value: new THREE.Color('#3268be') },
      uHigh: { value: new THREE.Color('#2fd9ff') },
    };
    const sky = new THREE.Mesh(new THREE.SphereGeometry(80, 32, 16), new THREE.ShaderMaterial({
      vertexShader: skyVertex, fragmentShader: skyFragment, uniforms: skyUniforms,
      side: THREE.BackSide, depthWrite: false,
    }));
    // #region material
    const swirlMaterial = new THREE.ShaderMaterial({
      vertexShader: uvVertex,
      fragmentShader: swirlFragment,
      uniforms: swirlUniforms,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
    });
    const swirl = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 3.6), swirlMaterial);
    // #endregion
    const wobble = new THREE.Mesh(new THREE.IcosahedronGeometry(1.45, 4), new THREE.ShaderMaterial({
      vertexShader: wobbleVertex, fragmentShader: wobbleFragment, uniforms: wobbleUniforms,
    }));
    // Vertex displacement can exceed the original bounding sphere.
    wobble.geometry.computeBoundingSphere();
    wobble.geometry.boundingSphere.radius += 0.65;
    scene.add(sky, swirl, wobble);

    // UI descriptions stay separate from the shader code.
    const examples = {
      sky: {
        mesh: sky, uniforms: skyUniforms, vertex: skyVertex, fragment: skyFragment, speed: 0.4,
        description: 'Inside a sphere: height paints the sky.', stage: 'fragment',
        sliders: [['speed', 'Speed', 0, 3, 0.1], ['uStrength', 'Sun glow', 0, 3, 0.1]],
        colours: [['uHorizon', 'Horizon'], ['uZenith', 'Zenith']],
      },
      swirl: {
        mesh: swirl, uniforms: swirlUniforms, vertex: uvVertex, fragment: swirlFragment, speed: 4,
        description: 'A flat plane: angle + radius paint a portal.', stage: 'fragment',
        sliders: [['speed', 'Speed', 0, 8, 0.1], ['uFrequency', 'Frequency', 1, 20, 0.5], ['uStrength', 'Strength', 0, 2, 0.1]],
        colours: [['uInner', 'Centre'], ['uOuter', 'Edge']],
      },
      wobble: {
        mesh: wobble, uniforms: wobbleUniforms, vertex: wobbleVertex, fragment: wobbleFragment, speed: 2,
        description: 'An icosahedron: vertices move along normals.', stage: 'vertex + fragment',
        sliders: [['speed', 'Speed', 0, 6, 0.1], ['uFrequency', 'Frequency', 0.5, 8, 0.1], ['uStrength', 'Strength', 0, 0.65, 0.01]],
        colours: [['uLow', 'Inward'], ['uHigh', 'Outward']],
      },
    };
    let active = examples.sky;
    let paused = false;
    const debug = document.getElementById('debug');
    const timeReadout = document.getElementById('time');

    function resetView() {
      controls.target.set(0, 0, 0);
      camera.position.set(0, 0.3, phone.matches ? 10.5 : 6.5);
      if (active === examples.sky) camera.position.y = phone.matches ? -0.8 : -2;
      controls.update();
      // Reserve space above the object for the compact phone panel.
      const w = window.innerWidth, h = window.innerHeight;
      if (phone.matches) camera.setViewOffset(w, h, 0, -h * 0.15, w, h);
      else camera.clearViewOffset();
    }
    window.addEventListener('resize', resetView);
    document.getElementById('reset').addEventListener('click', resetView);
    document.getElementById('pause').addEventListener('click', (e) => {
      paused = !paused;
      e.target.textContent = paused ? 'Resume time' : 'Pause time';
      e.target.setAttribute('aria-pressed', String(paused));
    });
    debug.addEventListener('change', () => { active.uniforms.uDebug.value = Number(debug.checked); });

    // #region uniform-input
    function bindSlider(input, output, key, example) {
      input.addEventListener('input', () => {
        const value = Number(input.value);
        if (key === 'speed') example.speed = value;
        else example.uniforms[key].value = value;
        output.value = value.toFixed(input.step === '0.01' ? 2 : 1);
      });
    }
    function bindColour(input, key, example) {
      input.addEventListener('input', () => {
        example.uniforms[key].value.set(input.value);
      });
    }
    // #endregion
    function selectShader(name) {
      active = examples[name];
      for (const example of Object.values(examples)) example.mesh.visible = example === active;
      document.querySelectorAll('[data-shader]').forEach((button) => {
        const selected = button.dataset.shader === name;
        button.classList.toggle('on', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      document.getElementById('description').textContent = active.description;
      document.getElementById('stage-name').textContent = active.stage;
      const readable = (source) => source.replace(/^ {6}/gm, '').trim();
      document.getElementById('source').textContent = '// VERTEX\n' + readable(active.vertex) + '\n\n// FRAGMENT\n' + readable(active.fragment);
      debug.checked = Boolean(active.uniforms.uDebug.value);
      const sliders = document.getElementById('sliders');
      sliders.replaceChildren();
      for (const [key, title, min, max, step] of active.sliders) {
        const label = document.createElement('label');
        label.className = 'uniform-row';
        label.append(document.createTextNode(title));
        const input = document.createElement('input');
        Object.assign(input, { type: 'range', min, max, step, value: key === 'speed' ? active.speed : active.uniforms[key].value });
        input.dataset.uniform = key;
        const output = document.createElement('output');
        output.value = Number(input.value).toFixed(step === 0.01 ? 2 : 1);
        label.append(input, output);
        sliders.append(label);
        bindSlider(input, output, key, active);
      }
      const colours = document.getElementById('colours');
      colours.replaceChildren();
      for (const [key, title] of active.colours) {
        const label = document.createElement('label');
        label.append(document.createTextNode(title));
        const input = document.createElement('input');
        input.type = 'color';
        input.value = '#' + active.uniforms[key].value.getHexString();
        input.dataset.uniform = key;
        label.append(input);
        colours.append(label);
        bindColour(input, key, active);
      }
      resetView();
    }
    document.querySelectorAll('[data-shader]').forEach((button) => {
      button.addEventListener('click', () => selectShader(button.dataset.shader));
    });
    window.addEventListener('keydown', (e) => {
      if (e.target.closest('input, button, summary')) return;
      const name = { Digit1: 'sky', Digit2: 'swirl', Digit3: 'wobble' }[e.code];
      if (name) selectShader(name);
    });
    selectShader('sky');

    // #region uniforms
    const timer = new THREE.Timer();
    timer.connect(document);
    renderer.setAnimationLoop((time) => {
      timer.update(time);
      const dt = timer.getDelta();
      if (!paused) active.uniforms.uTime.value += dt * active.speed;
      controls.update();
      timeReadout.textContent = active.uniforms.uTime.value.toFixed(2);
      renderer.render(scene, camera);
    });
    // #endregion
  </script>
</body>
</html>
